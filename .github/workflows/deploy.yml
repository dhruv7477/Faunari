name: Deploy

# Build & publish the serving image — but ONLY after the model passes the dangerous-recall
# release gate (BRD §9.3). Runs on pushes to master and on version tags.
on:
  push:
    branches: ["master"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release-gate:
    name: Dangerous-recall release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Enforce venomous-recall gate (BRD §9.3)
        run: python scripts/check_release_gate.py
        env:
          GATE_TEST_MIN: "0.98"
          GATE_HARDCASE_MIN: "0.98"   # production bar — met by fine-tuned v2 (test 0.998 / hardcase 0.984)

  build-and-push:
    name: Build & push image
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name (GHCR requires lowercase repository names)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy (configure target)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: |
          echo "Image published: ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          echo "No deploy target wired yet. Plug in your host here (e.g. SSH 'docker compose pull && up',"
          echo "Cloud Run, Azure Container Apps, or Fly.io). The container serves on port 8501."
